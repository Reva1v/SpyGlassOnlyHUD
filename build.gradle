plugins {
    id "net.fabricmc.fabric-loom" version "1.17-SNAPSHOT"
    id "java"
    id "com.modrinth.minotaur" version "2.+"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = Integer.parseInt(project.java_version)
}

java {
    sourceCompatibility = JavaVersion.toVersion(project.java_version)
    targetCompatibility = JavaVersion.toVersion(project.java_version)

    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    archiveVersion = "${project.mod_version}-${project.minecraft_version}"
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = project.modrinth_project_id
    versionNumber = project.mod_version
    versionName = "Spyglass Only HUD ${project.mod_version}"
    versionType = "release"
    uploadFile = file("build/libs/${project.archives_base_name}-${project.mod_version}-${project.minecraft_version}.jar")
    gameVersions = [project.minecraft_version]
    loaders = ["fabric"]
}
