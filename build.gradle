import com.modrinth.minotaur.dependencies.ModDependency

plugins {
    id "net.fabricmc.fabric-loom-remap" version "${loom_version}"
    id "java"
    id "com.modrinth.minotaur" version "2.+"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// Minecraft versions this jar is published for (falls back to the build target).
def gameVersionList = ((project.findProperty("modrinth_game_versions") ?: project.minecraft_version) as String).split(",").collect { it.trim() }
// Jar suffix: the single game version, or "<first>+" when one jar covers several.
// Set jar_mc_label to override it, e.g. a closed range on a frozen branch.
def jarMcLabel = project.findProperty("jar_mc_label") ?: (gameVersionList.size() == 1 ? gameVersionList[0] : "${gameVersionList[0]}+")

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = Integer.parseInt(project.java_version)
}

java {
    sourceCompatibility = JavaVersion.toVersion(project.java_version)
    targetCompatibility = JavaVersion.toVersion(project.java_version)

    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

remapJar {
    archiveVersion = "${project.mod_version}-${jarMcLabel}"
}

modrinth {
    token = project.findProperty("modrinthToken") ?: System.getenv("MODRINTH_TOKEN")
    projectId = project.modrinth_project_id
    versionNumber = project.mod_version
    versionName = "Spyglass Only HUD ${project.mod_version}"
    versionType = "release"
    uploadFile = file("build/libs/${project.archives_base_name}-${project.mod_version}-${jarMcLabel}.jar")
    gameVersions = gameVersionList
    loaders = ["fabric"]
    // Fabric API (P7dR8mSH), any version, required.
    // Set explicitly rather than via the `dependencies {}` DSL: inside this block Gradle
    // resolves `dependencies` to project.dependencies, so the DSL silently does nothing.
    dependencies = [new ModDependency("P7dR8mSH", "required")]
    changelog = """## 1.3.1
- **Fixed:** config could be read before it was initialised in rare cases — settings are now always resolved to a valid instance
- **Fixed:** a broken or empty config file no longer breaks the mod; it falls back to defaults and reports the problem in the log
- **Changed:** config read/write errors are written to the game log instead of the raw stack trace

## 1.3.0
- **Added:** mouse sensitivity now scales down with zoom level, so aiming stays controllable at high zoom (toggle in settings)
- **Changed:** zoom step is now multiplicative — zoom speed feels uniform across the whole range
- **Fixed:** settings keybind now persists across launches (unbinding/rebinding no longer resets to K)"""
}
