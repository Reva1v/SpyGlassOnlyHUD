import com.modrinth.minotaur.dependencies.ModDependency

plugins {
    id "net.fabricmc.fabric-loom" version "1.16-SNAPSHOT"
    id "java"
    id "com.modrinth.minotaur" version "2.+"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = Integer.parseInt(project.java_version)
}

java {
    sourceCompatibility = JavaVersion.toVersion(project.java_version)
    targetCompatibility = JavaVersion.toVersion(project.java_version)

    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    archiveVersion = "${project.mod_version}-${project.minecraft_version}"
}

modrinth {
    token = project.findProperty("modrinthToken") ?: System.getenv("MODRINTH_TOKEN")
    projectId = project.modrinth_project_id
    versionNumber = project.mod_version
    versionName = "Spyglass Only HUD ${project.mod_version}"
    versionType = "release"
    uploadFile = file("build/libs/${project.archives_base_name}-${project.mod_version}-${project.minecraft_version}.jar")
    gameVersions = ((project.findProperty("modrinth_game_versions") ?: project.minecraft_version) as String).split(",").collect { it.trim() }
    loaders = ["fabric"]
    // Fabric API (P7dR8mSH), any version, required.
    // Set explicitly rather than via the `dependencies {}` DSL: inside this block Gradle
    // resolves `dependencies` to project.dependencies, so the DSL silently does nothing.
    dependencies = [new ModDependency("P7dR8mSH", "required")]
    changelog = """## 1.3.1
- **Fixed:** config could be read before it was initialised in rare cases — settings are now always resolved to a valid instance
- **Fixed:** a broken or empty config file no longer breaks the mod; it falls back to defaults and reports the problem in the log
- **Changed:** config read/write errors are written to the game log instead of the raw stack trace

## 1.3.0
- **Added:** mouse sensitivity now scales down with zoom level, so aiming stays controllable at high zoom (toggle in settings)
- **Changed:** zoom step is now multiplicative — zoom speed feels uniform across the whole range
- **Fixed:** settings keybind now persists across launches (unbinding/rebinding no longer resets to K)"""
}
